name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'main.yml'
      - '*.lean'
      - 'lakefile.toml'
      - 'lean-toolchain'
  push:
    paths:
      - 'main.yml'
      - '*.lean'
      - 'lakefile.toml'
      - 'lean-toolchain'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Update dependencies
        run: lake update
      - name: Get dependency cache
        run: lake exe cache get
      - name: Build
        run: lake build
